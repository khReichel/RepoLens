<svg width="1200" height="630" viewBox="0 0 1200 630"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Helvetica Neue',Arial,sans-serif">

  <title>The Field Took Twenty Minutes — cover image</title>
  <desc>Dark header graphic in Calyntro blog style. A teal input field at center-right is surrounded by an orange web of hidden dependencies, illustrating tight coupling. Left panel shows the article title and key stats.</desc>

  <defs>
    <filter id="nodeGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="edgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tealGlow" x="-5%" y="-40%" width="110%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fieldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ambientGlow" gradientUnits="userSpaceOnUse" cx="960" cy="315" r="380">
      <stop offset="0%"   stop-color="#f5a623" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0b1e2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1200" height="630" fill="#0b1e2a"/>

  <!-- Scan lines -->
  <line x1="0" y1="90"  x2="1200" y2="90"  stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="180" x2="1200" y2="180" stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="360" x2="1200" y2="360" stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>
  <line x1="0" y1="540" x2="1200" y2="540" stroke="#182d3d" stroke-width="0.6" opacity="0.55"/>

  <!-- Ambient glow from coupling web -->
  <rect width="1200" height="630" fill="url(#ambientGlow)"/>

  <!-- ── RIGHT: COUPLING WEB ── -->
  <!--
    Center (the field): (960, 315)
    Outer ring (radius 155):
      N1 model       (960, 160)     top
      N2 service     (1070, 207)    NE
      N3 caller-1    (1115, 315)    E
      N4 caller-2    (1070, 423)    SE
      N5 caller-3    (960, 470)     bottom
      N6 caller-4    (850, 423)     SW
      N7 legacy      (805, 315)     W
      N8 no-tests    (850, 207)     NW
  -->

  <!-- Spokes: center → each outer node (the hidden blast radius) -->
  <line x1="960" y1="315" x2="960"  y2="160" stroke="#f5a623" stroke-width="2.4" opacity="0.88" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="1070" y2="207" stroke="#f5a623" stroke-width="2.8" opacity="0.92" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="1115" y2="315" stroke="#f5a623" stroke-width="2.0" opacity="0.80" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="1070" y2="423" stroke="#f5a623" stroke-width="2.0" opacity="0.78" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="960"  y2="470" stroke="#f5a623" stroke-width="1.6" opacity="0.68" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="850"  y2="423" stroke="#f5a623" stroke-width="1.6" opacity="0.68" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="805"  y2="315" stroke="#f5a623" stroke-width="2.2" opacity="0.84" filter="url(#edgeGlow)"/>
  <line x1="960" y1="315" x2="850"  y2="207" stroke="#f5a623" stroke-width="1.2" opacity="0.50"/>

  <!-- Ring edges (outer nodes wired together — more coupling) -->
  <line x1="960"  y1="160" x2="1070" y2="207" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="1070" y1="207" x2="1115" y2="315" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="1115" y1="315" x2="1070" y2="423" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="1070" y1="423" x2="960"  y2="470" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="960"  y1="470" x2="850"  y2="423" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="850"  y1="423" x2="805"  y2="315" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="805"  y1="315" x2="850"  y2="207" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>
  <line x1="850"  y1="207" x2="960"  y2="160" stroke="#f5a623" stroke-width="0.9" opacity="0.30"/>

  <!-- Diagonal cross-connections (system is a tangle, not just a ring) -->
  <line x1="960"  y1="160" x2="1070" y2="423" stroke="#f5a623" stroke-width="0.5" opacity="0.16"/>
  <line x1="1070" y1="207" x2="850"  y2="423" stroke="#f5a623" stroke-width="0.5" opacity="0.16"/>
  <line x1="1115" y1="315" x2="805"  y2="315" stroke="#f5a623" stroke-width="0.5" opacity="0.16"/>
  <line x1="1070" y1="207" x2="960"  y2="470" stroke="#f5a623" stroke-width="0.5" opacity="0.12"/>
  <line x1="850"  y1="207" x2="1070" y2="423" stroke="#f5a623" stroke-width="0.5" opacity="0.12"/>

  <!-- Outer nodes (orange — the problem) -->
  <circle cx="960"  cy="160" r="11" fill="#f5a623" opacity="0.85" filter="url(#nodeGlow)"/>
  <circle cx="1070" cy="207" r="13" fill="#f5a623" opacity="0.90" filter="url(#nodeGlow)"/>
  <circle cx="1115" cy="315" r="10" fill="#f5a623" opacity="0.78" filter="url(#nodeGlow)"/>
  <circle cx="1070" cy="423" r="10" fill="#f5a623" opacity="0.78" filter="url(#nodeGlow)"/>
  <circle cx="960"  cy="470" r="9"  fill="#f5a623" opacity="0.72" filter="url(#nodeGlow)"/>
  <circle cx="850"  cy="423" r="10" fill="#f5a623" opacity="0.78" filter="url(#nodeGlow)"/>
  <circle cx="805"  cy="315" r="12" fill="#f5a623" opacity="0.85" filter="url(#nodeGlow)"/>
  <circle cx="850"  cy="207" r="8"  fill="#f5a623" opacity="0.62"/>

  <!-- Node labels -->
  <text x="960"  y="143" fill="#a8660a" font-size="11" text-anchor="middle" font-weight="500">model</text>
  <text x="1086" y="201" fill="#a8660a" font-size="11" text-anchor="start"  font-weight="500">service</text>
  <text x="1129" y="319" fill="#a8660a" font-size="11" text-anchor="start"  font-weight="500">caller 1</text>
  <text x="1086" y="440" fill="#a8660a" font-size="11" text-anchor="start"  font-weight="500">caller 2</text>
  <text x="960"  y="490" fill="#a8660a" font-size="11" text-anchor="middle" font-weight="500">caller 3</text>
  <text x="836"  y="440" fill="#a8660a" font-size="11" text-anchor="end"    font-weight="500">caller 4</text>
  <text x="791"  y="319" fill="#a8660a" font-size="11" text-anchor="end"    font-weight="500">legacy</text>
  <text x="836"  y="201" fill="#a8660a" font-size="11" text-anchor="end"    font-weight="500">no tests</text>

  <!-- CENTER: The Field — an input box (what took 20 minutes) -->
  <rect x="912" y="296" width="96" height="38" rx="5"
        fill="#0d2233" stroke="#00d4b8" stroke-width="2.2" filter="url(#fieldGlow)"/>
  <text x="954" y="320" fill="#00d4b8" font-size="13.5" text-anchor="middle" font-weight="600"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace">field</text>
  <!-- Cursor -->
  <rect x="982" y="305" width="2" height="18" fill="#00d4b8" opacity="0.85"/>

  <!-- ── LEFT: TEXT CONTENT ── -->

  <!-- Accent bar -->
  <rect x="0" y="0" width="6" height="630" fill="#00d4b8"/>

  <!-- Category badge -->
  <rect x="60" y="64" width="280" height="34" rx="17"
        fill="none" stroke="#00d4b8" stroke-width="1.5" opacity="0.70"/>
  <text x="200" y="86" fill="#00d4b8" font-size="13" font-weight="500"
        text-anchor="middle">Software Architecture · Refactoring</text>

  <!-- Headline -->
  <text x="60" y="192" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1.5">The Field Took</text>
  <text x="60" y="266" fill="#00d4b8" font-size="64" font-weight="700"
        letter-spacing="-1.5" font-style="italic" filter="url(#tealGlow)">Twenty Minutes.</text>

  <!-- Sub-headline -->
  <text x="60" y="316" fill="#7a9aab" font-size="20">Everything around it took three days.</text>

  <!-- Divider -->
  <line x1="60" y1="348" x2="560" y2="348" stroke="#1e3c50" stroke-width="1.5"/>

  <!-- Stats -->
  <text x="60"  y="394" fill="#00d4b8" font-size="40" font-weight="700">1</text>
  <text x="60"  y="416" fill="#638090" font-size="13">field added</text>

  <text x="148" y="394" fill="#f5a623" font-size="40" font-weight="700">3 days</text>
  <text x="148" y="416" fill="#638090" font-size="13">of archaeology</text>

  <text x="366" y="394" fill="#f5a623" font-size="40" font-weight="700">8</text>
  <text x="366" y="416" fill="#638090" font-size="13">hidden deps</text>

  <!-- Dependency chain list -->
  <circle cx="72" cy="452" r="5" fill="#00d4b8"/>
  <text x="86" y="457" fill="#638090" font-size="13"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
        >field → model → service</text>

  <circle cx="72" cy="479" r="5" fill="#f5a623"/>
  <text x="86" y="484" fill="#638090" font-size="13"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
        >service → 4 callers (2 unknown)</text>

  <circle cx="72" cy="506" r="5" fill="#f5a623"/>
  <text x="86" y="511" fill="#638090" font-size="13"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
        >author: left 18 months ago</text>

  <circle cx="72" cy="533" r="5" fill="#f5a623"/>
  <text x="86" y="538" fill="#638090" font-size="13"
        font-family="'JetBrains Mono','Fira Code','Courier New',monospace"
        >tests: 0 · coverage: unknown</text>

  <!-- Footer -->
  <text x="1142" y="612" fill="#3a5868" font-size="13" text-anchor="end">calyntro.com/blog</text>

</svg>
