<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <title>Calyntro LinkedIn Banner</title>

  <!-- Background -->
  <rect width="1584" height="396" fill="#0a1f22"/>

  <!-- Subtle grid -->
  <g stroke="#0f2a2e" stroke-width="1">
    <line x1="0" y1="66" x2="1584" y2="66"/>
    <line x1="0" y1="132" x2="1584" y2="132"/>
    <line x1="0" y1="198" x2="1584" y2="198"/>
    <line x1="0" y1="264" x2="1584" y2="264"/>
    <line x1="0" y1="330" x2="1584" y2="330"/>
    <line x1="264" y1="0" x2="264" y2="396"/>
    <line x1="528" y1="0" x2="528" y2="396"/>
    <line x1="792" y1="0" x2="792" y2="396"/>
    <line x1="1056" y1="0" x2="1056" y2="396"/>
    <line x1="1320" y1="0" x2="1320" y2="396"/>
  </g>

  <!-- Right-side abstract visualization: nodes + edges -->
  <g stroke="#1e5a5f" stroke-width="1.2" fill="none" opacity="0.5">
    <line x1="1150" y1="198" x2="1260" y2="130"/>
    <line x1="1150" y1="198" x2="1300" y2="210"/>
    <line x1="1150" y1="198" x2="1240" y2="290"/>
    <line x1="1150" y1="198" x2="1100" y2="300"/>
    <line x1="1150" y1="198" x2="1070" y2="130"/>
    <line x1="1150" y1="198" x2="1200" y2="100"/>
    <line x1="1260" y1="130" x2="1300" y2="210"/>
    <line x1="1300" y1="210" x2="1240" y2="290"/>
    <line x1="1240" y1="290" x2="1100" y2="300"/>
    <line x1="1100" y1="300" x2="1070" y2="130"/>
    <line x1="1070" y1="130" x2="1200" y2="100"/>
    <line x1="1200" y1="100" x2="1260" y2="130"/>
    <!-- secondary outer ring -->
    <line x1="1380" y1="90" x2="1440" y2="160"/>
    <line x1="1440" y1="160" x2="1430" y2="280"/>
    <line x1="1430" y1="280" x2="1350" y2="340"/>
    <line x1="1350" y1="340" x2="1240" y2="290"/>
    <line x1="1380" y1="90" x2="1300" y2="210"/>
    <line x1="1440" y1="160" x2="1300" y2="210"/>
  </g>

  <!-- Node dots -->
  <g fill="#1d6870">
    <circle cx="1150" cy="198" r="6"/>
    <circle cx="1260" cy="130" r="4"/>
    <circle cx="1300" cy="210" r="4"/>
    <circle cx="1240" cy="290" r="4"/>
    <circle cx="1100" cy="300" r="4"/>
    <circle cx="1070" cy="130" r="4"/>
    <circle cx="1200" cy="100" r="4"/>
    <circle cx="1380" cy="90" r="3"/>
    <circle cx="1440" cy="160" r="3"/>
    <circle cx="1430" cy="280" r="3"/>
    <circle cx="1350" cy="340" r="3"/>
  </g>

  <!-- Highlighted hotspot node -->
  <circle cx="1150" cy="198" r="14" fill="none" stroke="#2dd4c4" stroke-width="1.5" opacity="0.6"/>
  <circle cx="1150" cy="198" r="8" fill="#2a8a8f"/>

  <!-- Accent line left border -->
  <rect x="60" y="80" width="3" height="236" fill="#2dd4c4" opacity="0.8"/>

  <!-- Main headline -->
  <text x="92" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#dff2f0" letter-spacing="-0.5">Dein Legacy-Code kostet dich</text>
  <text x="92" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" fill="#dff2f0" letter-spacing="-0.5">mehr als du denkst.</text>

  <!-- Sub-line -->
  <text x="92" y="272" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="400" fill="#2dd4c4">Calyntro zeigt wo.</text>

  <!-- URL -->
  <text x="92" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="300" fill="#5ba3a0" opacity="0.9">calyntro.com</text>
</svg>
